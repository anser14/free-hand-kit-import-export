name: Release package

on:
  workflow_dispatch:

# PyPI versions and their artifacts are immutable. Never overlap publication runs.
concurrency:
  group: freehand-kit-import-export-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Store immutable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/freehand-kit-import-export/
    permissions:
      id-token: write
    steps:
      - name: Retrieve release artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Upload to TestPyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/freehand-kit-import-export/
    permissions:
      id-token: write
    steps:
      - name: Retrieve the tested release artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Upload to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
