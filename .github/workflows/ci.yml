name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            django: ">=5.2,<5.3"
            django_name: "5.2 LTS"
          - python: "3.12"
            django: ">=5.2,<5.3"
            django_name: "5.2 LTS"
          - python: "3.13"
            django: ">=6.0,<6.1"
            django_name: "6.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]" "Django${{ matrix.django }}"
      - run: python -m pytest

  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check src tests
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m coverage run -m pytest
      - run: python -m coverage report
      - run: python -m build
      - run: python -m twine check dist/*
