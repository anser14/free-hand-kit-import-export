[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "freehand-kit-import-export"
version = "0.10.0"
description = "Declarative, CSV-first Django REST Framework import and export APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Freehand Kit contributors" },
]
keywords = ["django", "django-rest-framework", "csv", "import", "export", "openapi"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "Django>=5.2,<6.1",
  "djangorestframework>=3.17.2,<3.18",
  "django-import-export>=4.4,<5",
  "drf-spectacular>=0.29,<1",
]

[project.optional-dependencies]
xlsx = ["django-import-export[xlsx]>=4.4,<5"]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "django-stubs[compatible-mypy]>=5.1",
  "djangorestframework-stubs>=3.15",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-django>=4.9",
  "ruff>=0.8",
  "twine>=6.0",
  "types-django-import-export>=4.4.0.20260402,<5",
]

[project.urls]
Documentation = "https://github.com/anser14/free-hand-kit-import-export#readme"
Issues = "https://github.com/anser14/free-hand-kit-import-export/issues"
Source = "https://github.com/anser14/free-hand-kit-import-export"
Changelog = "https://github.com/anser14/free-hand-kit-import-export/blob/main/CHANGELOG.md"
Security = "https://github.com/anser14/free-hand-kit-import-export/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/fk_import_export"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["fk_import_export"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "tests.settings"
